apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  labels:
    app: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
      - name: accounts
        image: us.icr.io/${SN_ICR_NAMESPACE}/accounts:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: cd-secret
